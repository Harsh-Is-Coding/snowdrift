<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Snowdrift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --snow:#F4F8FB; --glacier:#BFE3F2; --teal:#3E7C93; --navy:#0B1E2D; --aurora:#7CF2C2;
  --frost:rgba(244,248,251,.15); --frost-line:rgba(244,248,251,.28); --veil:rgba(11,30,45,.42);
  --font:"Nunito","Segoe UI",system-ui,sans-serif; --ice:72px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--navy);color:var(--snow);font:400 16px/1.5 var(--font);overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--aurora);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ---------- world: sea cross-section ---------- */
#sea{position:fixed;left:0;right:0;top:0;z-index:0;transition:transform 1.6s cubic-bezier(.3,.7,.2,1);will-change:transform}
#sea .iceline{position:absolute;left:0;right:0;height:2px;background:var(--snow);opacity:.9}
.mark{position:absolute;color:var(--snow)}
.mark svg{display:block;fill:var(--snow);fill-opacity:.09;stroke:none}
.mark .lbl{font-size:13px;font-weight:600;color:var(--snow);opacity:.85;margin-top:4px;white-space:nowrap}
#specks{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

/* home surface scene */
#sky{position:fixed;inset:0;z-index:2;background:linear-gradient(180deg,var(--teal) 0%,var(--teal) 30%,var(--glacier) 67%);transition:opacity .5s}
#sky .ground{position:absolute;left:-10%;right:-10%;bottom:0;height:34%;background:var(--snow);border-radius:50% 50% 0 0 / 60px 60px 0 0}
body[data-scene="water"] #sky{display:none}

/* ---------- menu ---------- */
#menuBtn{position:fixed;top:14px;right:14px;z-index:30;width:44px;height:44px;border-radius:50%;border:0;background:var(--veil);display:grid;place-items:center;color:var(--snow)}
#menuBtn svg{width:22px;height:22px}
#menu{position:fixed;top:0;right:0;bottom:0;width:min(300px,86vw);z-index:40;background:var(--navy);transform:translateX(100%);visibility:hidden;transition:transform .35s cubic-bezier(.3,.7,.2,1),visibility 0s .35s;padding:18px 18px 24px;display:grid;align-content:start;gap:6px;box-shadow:-20px 0 40px rgba(11,30,45,.5)}
#menu.open{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.3,.7,.2,1)}
#menu .close{justify-self:end;width:44px;height:44px;border-radius:50%;border:0;background:transparent;font-size:28px;line-height:1}
#menu .item{display:flex;gap:14px;align-items:center;padding:12px 10px;border-radius:12px;border:0;background:transparent;text-align:left;font-size:17px;font-weight:600}
#menu .item:hover{background:var(--frost)}
#menu .item svg{width:22px;height:22px;flex:none}
#scrim{position:fixed;inset:0;z-index:35;background:rgba(11,30,45,.5);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}

/* ---------- layout ---------- */
#app{position:relative;z-index:10;max-width:560px;margin:0 auto;padding:calc(var(--ice) + 22px) 16px 48px;min-height:100vh}
body[data-scene="water"] #app{padding-right:84px}
@media (min-width:860px){body[data-scene="water"] #app{padding-right:16px}}
.frost{background:var(--veil);border:1px solid var(--frost-line);border-radius:16px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 100vmax var(--frost)}
.btn{border:0;border-radius:999px;padding:13px 30px;font-weight:800;font-size:17px;background:var(--aurora);color:var(--navy)}
.btn.line{background:transparent;color:var(--snow);border:2px solid var(--glacier)}
.btn.teal{background:var(--teal);color:var(--snow)}
.btn.sm{padding:8px 18px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:6px 4px;text-decoration:underline;text-underline-offset:3px;font-weight:600}
.muted{opacity:.85}
h1,h2,h3{margin:0;font-weight:800;line-height:1.15}
p{margin:0}

/* home */
#home{position:fixed;inset:0;z-index:11;display:grid;grid-template-rows:1fr auto;justify-items:center;padding:0 16px}
#home .title{align-self:end;padding-bottom:9vh;text-align:center;display:grid;gap:10px}
#home h1{font-size:clamp(44px,13vw,76px);letter-spacing:.08em;color:var(--snow);text-shadow:0 0 24px rgba(191,227,242,.9),0 0 2px rgba(191,227,242,.8)}
#home .tag{font-size:21px;font-weight:700;color:var(--snow)}
#home .base{height:34vh;display:grid;align-content:center;justify-items:center;gap:12px;color:var(--navy)}
#home .base .links{display:flex;gap:18px}
#home .base .links .link{color:var(--navy)}
#home .base .meta{font-size:15px;color:var(--navy);font-weight:600}
body[data-scene="water"] #home{display:none}
body[data-scene="home"] #app{display:none}
/* the gauge is only needed while diving */
body[data-view="end"] #gauge{display:none}
body[data-view="end"] #app{padding-right:16px}
/* phones: landmark labels would sit on top of the controls */
@media (max-width:699px){
  .mark .lbl{display:none}
  .mark svg{fill-opacity:.07}
  .card{padding:20px 18px}
  .answer{grid-template-columns:minmax(0,1fr) 54px;gap:10px}
  .ring,.ring svg{width:54px;height:54px}
  .answer input{font-size:17px;padding:13px 16px}
  .dots{gap:7px}
  .depth{font-size:18px}
  #result .tname{font-size:24px}
  #home .base{gap:10px}
}

/* breaking the ice */
#breaker{position:fixed;inset:0;z-index:50;background:var(--glacier);color:var(--navy);display:grid;place-items:center;pointer-events:none;opacity:0}
#breaker.on{opacity:1}
#breaker p{font-size:22px;font-weight:700;position:relative;z-index:1;margin-top:-90px}
#breaker svg{position:absolute;left:0;top:50%;width:100%;height:80px;transform:translateY(-50%)}
#breaker polyline{fill:none;stroke:var(--teal);stroke-width:3;stroke-linejoin:round;stroke-dasharray:1600;stroke-dashoffset:1600}
#breaker.crack polyline{transition:stroke-dashoffset .6s ease-out;stroke-dashoffset:0}
#breaker.drop{transition:transform .65s cubic-bezier(.5,0,.8,.4),opacity .65s;transform:translateY(-100%);opacity:0}

/* ---------- game ---------- */
.prog{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.dots{display:flex;gap:9px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--glacier);display:block}
.dots i.done{background:var(--glacier)}
.dots i.top{background:var(--aurora);border-color:var(--aurora)}
.dots i.now{background:var(--snow);border-color:var(--snow);box-shadow:0 0 0 4px rgba(244,248,251,.25),0 0 14px var(--glacier)}
.depth{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.card{padding:24px 22px;display:grid;gap:10px;margin-bottom:16px}
.qn{font-size:14px;font-weight:700;letter-spacing:.04em;opacity:.85}
.prompt{font-size:clamp(26px,6.4vw,31px);font-weight:600;line-height:1.25;text-wrap:balance}
.hint{font-size:16px;opacity:.85}
.answer{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:12px;align-items:center}
.answer input{width:100%;min-width:0;font-size:19px;font-weight:600;padding:15px 20px;border-radius:999px;border:2px solid var(--glacier);background:rgba(191,227,242,.14);color:var(--snow);outline:none}
.answer input::placeholder{color:var(--snow);opacity:.75}
.answer input:focus{background:rgba(191,227,242,.22);box-shadow:0 0 0 4px rgba(191,227,242,.25)}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.answer input.shake{animation:shake .25s}
.ring{position:relative;width:64px;height:64px}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:rgba(191,227,242,.3)}
.ring .fg{stroke:var(--snow);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring .flake{position:absolute;inset:0;display:grid;place-items:center}
.ring .flake svg{width:24px;height:24px;transform:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.ring.low{animation:pulse 1s ease-in-out infinite}
.note{min-height:24px;font-size:16px;margin:10px 4px 0}
.note b{color:var(--aurora)}
.note.care{background:var(--navy);border:1px solid var(--frost-line);border-radius:12px;padding:12px 14px}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:12px}

/* countdown */
#count{position:fixed;inset:0;z-index:25;display:grid;place-items:center;pointer-events:none}
#count span{font-size:120px;font-weight:800;color:var(--snow);text-shadow:0 0 30px rgba(191,227,242,.7)}
@keyframes cd{from{transform:scale(1.4);opacity:0}25%{opacity:1}to{transform:scale(.85);opacity:.15}}
#count span.go{animation:cd 1s ease-out forwards}

/* depth gauge */
#gauge{position:fixed;right:12px;top:calc(var(--ice) + 70px);bottom:40px;width:62px;z-index:12;pointer-events:none}
body[data-scene="home"] #gauge{display:none}
#gauge .tube{position:absolute;right:8px;top:0;bottom:22px;width:10px;border-radius:5px;background:rgba(191,227,242,.18);border:1px solid rgba(191,227,242,.45)}
#gauge .fill{position:absolute;left:0;right:0;top:0;height:0;border-radius:5px;background:linear-gradient(180deg,var(--glacier),var(--teal));transition:height 1.4s cubic-bezier(.3,.7,.2,1)}
#gauge .bulb{position:absolute;right:2px;bottom:0;width:22px;height:22px;border-radius:50%;background:rgba(191,227,242,.18);border:1px solid rgba(191,227,242,.45)}
#gauge .cap{position:absolute;right:0;top:-8px;width:26px;height:2px;background:var(--snow)}
#gauge .notch{position:absolute;right:24px;transform:translateY(-50%);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;white-space:nowrap}
#gauge .notch::after{content:"";width:9px;height:2px;background:var(--glacier)}
#gauge .notch .nm{display:none}
#gauge .notch.hit{color:var(--aurora)}
#gauge .notch.hit::after{background:var(--aurora)}
@media (min-width:860px){#gauge{width:170px}#gauge .notch .nm{display:inline}}

/* the sinking answer */
.crystal{position:fixed;z-index:28;left:0;top:0;padding:8px 14px;border-radius:12px;background:rgba(191,227,242,.28);border:1.5px solid var(--glacier);color:var(--snow);font-weight:800;font-size:15px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;pointer-events:none;transform-origin:center}
.bubble{position:fixed;z-index:27;width:7px;height:7px;border-radius:50%;border:1.5px solid var(--glacier);pointer-events:none}
.burst{position:fixed;z-index:27;width:60px;height:24px;pointer-events:none}
.burst path{fill:none;stroke:var(--snow);stroke-width:2;stroke-linecap:round}
#aurora{position:fixed;left:0;right:0;top:0;height:130px;z-index:26;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,transparent,rgba(124,242,194,.45),rgba(124,242,194,.1),rgba(124,242,194,.5),transparent) 0 0/200% 100%;
  -webkit-mask:linear-gradient(180deg,#000,transparent);mask:linear-gradient(180deg,#000,transparent)}
@keyframes ripple{0%{opacity:0;background-position:0 0}20%{opacity:1}80%{opacity:1}100%{opacity:0;background-position:-200% 0}}
#aurora.on{animation:ripple 3.2s ease-in-out}

/* result sheet */
#result{position:fixed;left:0;right:0;bottom:0;z-index:29;padding:0 12px 14px;transform:translateY(110%);visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s}
#result.up{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#result .frost{max-width:560px;margin:0 auto;padding:22px;display:grid;gap:8px;background:var(--navy);box-shadow:0 -10px 40px rgba(11,30,45,.6)}
#result .top{display:flex;align-items:center;gap:12px}
#result .top svg{width:34px;height:34px}
#result .tname{font-size:28px;font-weight:800}
#result .nums{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
#result .said{font-size:16px;opacity:.85;overflow-wrap:anywhere}
#result .fact{font-size:16px}
#result .row{display:flex;justify-content:flex-end;margin-top:6px}

/* icons */
.ic{width:24px;height:24px;color:var(--snow);flex:none}
.ic.star{color:var(--aurora);fill:rgba(124,242,194,.25);filter:drop-shadow(0 0 6px rgba(124,242,194,.8))}
.ic.miss{opacity:.5}

/* end */
#end .card{gap:16px}
.score{font-size:20px;font-weight:700}
.bigdepth{font-size:clamp(48px,14vw,64px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.rating{font-size:20px;font-weight:700}
.rating b{color:var(--aurora)}
.icons{display:flex;gap:10px;flex-wrap:wrap}
.icons .ic{width:30px;height:30px}
.curve svg{width:100%;height:auto;display:block}
.curve .cap{font-size:15px;opacity:.85}
.rows{display:grid}
.rows .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--frost-line)}
.rows .q{font-size:14px;opacity:.85;grid-column:1 / -1}
.rows .a{font-weight:700;overflow-wrap:anywhere}
.rows .t{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-weight:700;font-size:15px;white-space:nowrap}
@media (max-width:699px){.rows .r{grid-template-columns:minmax(0,1fr)}.rows .t{justify-content:flex-start}}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.next{font-size:15px;opacity:.85}
.ok{font-size:15px;color:var(--aurora);overflow-wrap:anywhere}
.quotes{display:grid;gap:14px}
.quote{display:grid;gap:6px}
.quote label{font-size:14px;opacity:.85}
.quote textarea{width:100%;min-height:84px;field-sizing:content;resize:vertical;font-size:18px;font-weight:600;padding:12px 14px;border-radius:12px;border:2px dashed var(--glacier);background:rgba(191,227,242,.1);color:var(--snow)}
.quote .row{display:flex;justify-content:flex-end;gap:10px;align-items:center}

/* sheets: how to play, past days, all answers, settings, station tools */
#sheet{position:fixed;inset:0;z-index:45;display:grid;place-items:center;padding:16px;background:rgba(11,30,45,.6)}
#sheet>.frost{background:var(--navy);width:min(600px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:grid;gap:14px}
#sheet .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
#sheet .head h2{font-size:24px}
#sheet .x{width:44px;height:44px;border-radius:50%;border:0;background:transparent;font-size:28px;line-height:1}
.tiers{display:grid;gap:10px}
.tiers .tr{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center}
.tiers .tr small{display:block;opacity:.85;font-size:15px}
.tiers .pts{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;font-size:15px}
.lst{display:grid;gap:10px}
.lst .tl{font-size:15px}
.lst .tl b{display:inline-flex;gap:6px;align-items:center;vertical-align:middle}
.lst .tl .ic{width:20px;height:20px}
.lst .tl span{opacity:.85}
.days{display:grid;gap:8px}
.days button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--frost-line);background:var(--frost);text-align:left;font-weight:600}
.toggle{display:flex;gap:12px;align-items:flex-start}
.toggle input{width:22px;height:22px;margin-top:1px;accent-color:var(--aurora);flex:none}
.staff table{width:100%;border-collapse:collapse;font-size:15px}
.staff th,.staff td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--frost-line);vertical-align:middle}
.staff th{font-size:13px;opacity:.85}
.staff td.n{text-align:right;width:3ch}
.staff select,.staff input[type=text],.staff textarea{padding:7px 9px;border-radius:8px;border:1.5px solid var(--glacier);background:rgba(191,227,242,.1);color:var(--snow);max-width:100%}
.staff select option{background:var(--navy)}
.staff textarea{width:100%;min-height:90px;font-size:13px}
.tablewrap{overflow-x:auto}
.fl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.empty{opacity:.85;font-size:15px;padding:12px;border:1px dashed var(--frost-line);border-radius:12px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="sea" aria-hidden="true"><div class="iceline"></div></div>
<canvas id="specks" aria-hidden="true"></canvas>
<div id="sky" aria-hidden="true"><div class="ground"></div></div>
<div id="aurora" aria-hidden="true"></div>

<button id="menuBtn" aria-label="menu" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<div id="scrim"></div>
<nav id="menu" aria-label="menu">
  <button class="close" id="menuClose" aria-label="close menu">×</button>
  <button class="item" data-go="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>today's dive</button>
  <button class="item" data-go="past"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>past days</button>
  <button class="item" data-go="how"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 015 .5c0 1.5-2.5 2-2.5 3.5M12 17h.01"/></svg>how to play</button>
  <button class="item" data-go="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>settings</button>
</nav>

<section id="home">
  <div class="title"><h1>SNOWDRIFT</h1><p class="tag">one in a snowdrift.</p></div>
  <div class="base">
    <button class="btn" id="goBtn">go under</button>
    <div class="links"><button class="link" data-go="how">how to play</button><button class="link" data-go="past">past days</button></div>
    <p class="meta" id="homeMeta"></p>
  </div>
</section>

<div id="breaker" aria-hidden="true"><p>breaking the ice…</p><svg viewBox="0 0 1000 80" preserveAspectRatio="none"><polyline points="0,40 90,34 160,48 240,30 320,44 390,26 470,46 540,36 610,52 700,32 780,44 850,28 930,42 1000,36"/></svg></div>
<div id="count" aria-live="assertive"></div>

<main id="app">
  <section id="play" hidden>
    <div class="prog"><div class="dots" id="dots" role="img"></div><span class="depth" id="depth">0 m</span></div>
    <div class="card frost" id="pcard" hidden>
      <span class="qn" id="qn"></span>
      <p class="prompt" id="prompt"></p>
      <p class="hint" id="phint"></p>
    </div>
    <form id="form" autocomplete="off" hidden>
      <div class="answer">
        <input id="inp" type="text" maxlength="60" placeholder="type one answer" aria-label="your answer" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="ring" id="ring" aria-hidden="true">
          <svg viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="28"/><circle class="fg" id="ringFg" cx="32" cy="32" r="28"/></svg>
          <div class="flake"><svg viewBox="0 0 24 24" fill="none" stroke="#F4F8FB" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg></div>
        </div>
      </div>
      <span class="sr" id="srTime" aria-live="polite"></span>
      <p class="note" id="note" aria-live="polite"></p>
      <div class="actions"><button class="link" type="button" id="skipBtn">skip</button><button class="btn" type="submit" id="dropBtn">drop</button></div>
    </form>
  </section>

  <section id="end" hidden>
    <div class="card frost">
      <p class="score" id="eScore"></p>
      <p class="bigdepth" id="eDepth"></p>
      <p class="rating" id="eRating"></p>
      <div class="icons" id="eIcons"></div>
      <div class="curve"><svg id="eCurve" viewBox="0 0 320 110" role="img"></svg><p class="cap" id="eCurveCap"></p></div>
      <div class="rows" id="eRows"></div>
      <div class="btnrow"><button class="btn" id="playAgain">play again</button><button class="btn line" id="shareBtn">share</button><button class="btn line" id="allBtn">see all answers</button><span class="ok" id="shareMsg" aria-live="polite"></span></div>
      
    </div>
    <div class="card frost">
      <h2 style="font-size:22px">turn it into a snowflake quote</h2>

function buildGauge(){

// ---------- particles: falling snow on the surface, slow specks under water ----------
const cv = $("specks"), cx = cv.getContext("2d");
let parts = [];
function sizeParts(){ const r = devicePixelRatio||1; cv.width = innerWidth*r; cv.height = innerHeight*r; cx.setTransform(r,0,0,r,0,0); const n = Math.round(Math.min(90, innerWidth/14)); parts = Array.from({length:n}, ()=>({x:Math.random()*innerWidth, y:Math.random()*innerHeight, r:.8+Math.random()*2.2, s:.25+Math.random()*.7, w:Math.random()*6.28})); }

    else { p.y += p.s; p.w += .01; p.x += Math.sin(p.w)*.35; cx.globalAlpha = .85; }

// ---------- the sinking answer ----------
async function sink(word, t){
  if(reduce || !document.body.animate){ await wait(250); markNotch(t); if(t===5) aurora(); return; }
  const input = $("inp").getBoundingClientRect();
  const el = document.createElement("div"); el.className = "crystal"; el.textContent = word; document.body.append(el);
  const w = el.offsetWidth, h = el.offsetHeight;
  const glow = [6,9,13,18,24,32][t], col = t===5 ? "124,242,194" : "191,227,242";
  el.style.boxShadow = `0 0 ${glow}px rgba(${col},${.35 + t*.1})`;
  const g = $("gauge").getBoundingClientRect(), end = notchPoint(t);
  const at = (x, y, s) => `translate(${x - w/2}px,${y - h/2}px) scale(${s})`;
  const sx = input.left + Math.min(input.width/2, w/2 + 20), sy = input.top + input.height/2;
  const fit = x => Math.min(x, innerWidth - w*.62/2 - 8);
  const ix = fit(g.right - 13 - 30), iy = g.top - 8;
  // 1. the word shrinks into a glowing crystal and rises to the ice line
  await el.animate([{transform:at(sx,sy,1)}, {transform:at(ix,iy,.55)}], {duration:420, easing:"cubic-bezier(.4,0,.2,1)", fill:"forwards"}).finished;
  // 2. it cracks through
  crackSound(); burst(g.right - 13, iy);
  await wait(200);
  // 3. it drifts down past the notches, slowing as it nears its tier, glowing brighter the deeper it goes
  el.style.boxShadow = `0 0 ${glow*1.7}px rgba(${col},${.45 + t*.1})`;
  const ex = fit(end.x - 30), dur = 520 + t*200;
  const drift = el.animate([{transform:at(ix,iy,.55)}, {transform:at(ex,end.y,.6)}], {duration:dur, easing:"cubic-bezier(.25,.6,.3,1)", fill:"forwards"});
  const bub = setInterval(()=>{ const r = el.getBoundingClientRect(); bubble(r.left + r.width/2, r.top); if(Math.random()<.35) bubbleSound(); }, 110);
  await drift.finished; clearInterval(bub);
  // 4. it settles with a soft pulse of light
  markNotch(t);
  await el.animate([{transform:at(ex,end.y,.6), filter:"brightness(1)"}, {transform:at(ex,end.y,.72), filter:"brightness(1.7)"}, {transform:at(ex,end.y,.6), filter:"brightness(1)"}], {duration:380, easing:"ease-out", fill:"forwards"}).finished;
  if(t===5) aurora();
  el.animate([{opacity:1},{opacity:0}], {duration:300, fill:"forwards"}).finished.then(()=>el.remove());
}
function markNotch(t){ const n = document.querySelector(`#gauge .notch[data-t="${t}"]`); if(n) n.classList.add("hit"); }
function bubble(x, y){ const b = document.createElement("div"); b.className = "bubble"; b.style.left = (x - 3 + (Math.random()*10-5)) + "px"; b.style.top = y + "px"; document.body.append(b); b.animate([{transform:"translateY(0)", opacity:.9}, {transform:"translateY(-34px)", opacity:0}], {duration:700, easing:"ease-out"}).finished.then(()=>b.remove()); }
function burst(x, y){ const s = document.createElementNS("http://www.w3.org/2000/svg","svg"); s.setAttribute("viewBox","0 0 60 24"); s.setAttribute("class","burst"); s.style.left = (x-30)+"px"; s.style.top = (y-12)+"px"; s.innerHTML = '<path d="M30 12L18 6M30 12L10 13M30 12l12-7M30 12l18 2M30 12l-6 10M30 12l7 9"/>'; document.body.append(s); s.animate([{transform:"scale(.3)", opacity:1}, {transform:"scale(1.2)", opacity:0}], {duration:420, easing:"ease-out"}).finished.then(()=>s.remove()); }
function aurora(){ const a = $("aurora"); a.classList.remove("on"); void a.offsetWidth; a.classList.add("on"); }

let wording = 0, nextTimer = null;
function finish(){

  drawCurve(pts); wording = 0; renderQuotes();
}
function drawCurve(pts){
  const mu = 260, sd = 95;
  const W = 320, B = 84, X = v => 10 + v/MAXPTS*(W-20), pdf = v => Math.exp(-((v-mu)**2)/(2*sd*sd));
  let d = `M${X(0)} ${B}`; for(let v=0; v<=MAXPTS; v+=10) d += ` L${X(v).toFixed(1)} ${(B - pdf(v)*(B-10)).toFixed(1)}`; d += ` L${X(MAXPTS)} ${B}Z`;
  const pct = Math.round(100*.5*(1+erf((pts-mu)/sd/Math.SQRT2)));
  const f = 'fill="#F4F8FB" font-family="Nunito, sans-serif"';
  $("eCurve").innerHTML = `<path d="${d}" fill="rgba(191,227,242,.22)" stroke="#BFE3F2" stroke-width="1.5"/>
    <line x1="${X(pts)}" y1="8" x2="${X(pts)}" y2="${B}" stroke="#7CF2C2" stroke-width="3" stroke-linecap="round"/><circle cx="${X(pts)}" cy="8" r="4" fill="#7CF2C2"/>
    <text x="${Math.min(Math.max(X(pts),24),W-24)}" y="104" text-anchor="middle" font-size="13" font-weight="700" ${f}>you</text>
    <text x="10" y="104" font-size="12" ${f}>0</text><text x="${W-10}" y="104" text-anchor="end" font-size="12" ${f}>700</text>`;
  $("eCurve").setAttribute("aria-label", `score curve with your score of ${pts} marked`);
  $("eCurveCap").textContent = `a rough guess: deeper than about ${Math.min(99,Math.max(1,pct))}% of divers.`;
}
function erf(x){ const s = Math.sign(x); x = Math.abs(x); const t = 1/(1+.3275911*x); return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x)); }
function nextDive(){

}

function renderQuotes(){

$("reword").onclick = ()=>{ wording++; renderQuotes(); };
$("again").onclick = toHome;
$("playAgain").onclick = ()=>startDive(null);

// ---------- station tools (settings → station tools, ctrl+shift+s, or #staff) ----------
function tierSelect(sel){ return TIERS.map((t,i)=>`<option value="${i}"${i===sel?" selected":""}>${esc(t.name)} (${t.pts})</option>`).join(""); }
function showStaff(){
  const box = document.createElement("div"); box.className = "staff"; box.style.cssText = "display:grid;gap:18px";
  box.innerHTML = `<p class="muted">everything here is saved on this device only.</p>
  <label class="toggle"><input type="checkbox" id="lenT"${lenient?" checked":""}><span><b>lenient mode.</b> answers that aren't on the list land in snowfall (30) instead of being turned away. gibberish and rude words are still blocked.</span></label>
  <div style="display:grid;gap:8px"><h3>answers that weren't on the list</h3><p class="muted">add good ones to a tier so they count from now on.</p><div class="tablewrap" id="missed"></div></div>
  <div style="display:grid;gap:8px"><h3>add an answer</h3><div class="fl"><select id="addPrompt" aria-label="prompt"></select><input type="text" id="addText" placeholder="answer, or several separated by |" aria-label="answer"><select id="addTier" aria-label="tier"></select><button class="btn sm" id="addBtn">add</button></div><span class="ok" id="addMsg" aria-live="polite"></span></div>
  <div style="display:grid;gap:8px"><h3>answers you added</h3><div class="tablewrap" id="custom"></div></div>
  <div style="display:grid;gap:8px"><h3>move to another device</h3><p class="muted">copy this text, paste it into station tools on the other device, then press import.</p><textarea id="xfer" aria-label="station data"></textarea>
  <div class="fl"><button class="btn line sm" id="exportBtn">show my data</button><button class="btn line sm" id="importBtn">import</button><span class="ok" id="xferMsg" aria-live="polite"></span></div></div>`;
  openSheet("station tools", box);
  $("lenT").onchange = e => { lenient = e.target.checked; store(KEY.lenient, lenient); };
  $("addPrompt").innerHTML = ALL.map(p=>`<option value="${p.id}">${esc(p.q)}</option>`).join("");
  $("addTier").innerHTML = tierSelect(3);
  $("addBtn").onclick = ()=>{ const ok = addCustom($("addPrompt").value, $("addText").value, +$("addTier").value); $("addMsg").textContent = ok ? "added. it counts from now on." : "type an answer first."; if(ok){ $("addText").value = ""; renderStaff(); } setTimeout(()=>$("addMsg").textContent = "", 2500); };
  $("exportBtn").onclick = ()=>{ $("xfer").value = JSON.stringify({custom, missed}); $("xfer").select(); $("xferMsg").textContent = "copy the text above."; };
  $("importBtn").onclick = ()=>{
    try{
      const d = JSON.parse($("xfer").value);
      if(d.custom) for(const [pid, list] of Object.entries(d.custom)) if(BYID[pid] && Array.isArray(list)) list.forEach(c=>{ if(c && typeof c.t==="string" && c.tier>=0 && c.tier<=5 && !(custom[pid]||[]).some(x=>x.t===c.t)) (custom[pid]||(custom[pid]=[])).push({t:c.t.slice(0,200), tier:c.tier|0}); });
      store(KEY.custom, custom); ALL.forEach(p=>rebuild(p.id)); renderStaff(); $("xferMsg").textContent = "imported the added answers.";
    }catch(e){ $("xferMsg").textContent = "that text isn't valid station data."; }
  };
  renderStaff();
}
function renderStaff(){
  const rows = [];
  for(const [pid, m] of Object.entries(missed)) for(const [k, v] of Object.entries(m)) rows.push({pid, k, ...v});
  rows.sort((a,b)=>b.n-a.n);
  $("missed").innerHTML = rows.length ? `<table><thead><tr><th>answer</th><th>prompt</th><th>times</th><th>add as</th><th></th></tr></thead><tbody>${rows.slice(0,80).map((r,i)=>`<tr><td>${esc(r.t)}</td><td class="muted">${esc(BYID[r.pid] ? BYID[r.pid].q : r.pid)}</td><td class="n">${r.n}</td><td><select data-i="${i}" aria-label="tier for ${esc(r.t)}">${tierSelect(3)}</select></td><td><div class="fl" style="flex-wrap:nowrap"><button class="btn sm" data-add="${i}">add</button><button class="btn line sm" data-dis="${i}">dismiss</button></div></td></tr>`).join("")}</tbody></table>` : `<p class="empty">nothing yet. answers that don't match any list show up here.</p>`;
  $("missed").querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{ const r = rows[+b.dataset.add]; const tier = +$("missed").querySelector(`select[data-i="${b.dataset.add}"]`).value; addCustom(r.pid, r.t, tier); delete missed[r.pid][r.k]; store(KEY.missed, missed); renderStaff(); });
  $("missed").querySelectorAll("[data-dis]").forEach(b=>b.onclick=()=>{ const r = rows[+b.dataset.dis]; delete missed[r.pid][r.k]; store(KEY.missed, missed); renderStaff(); });
  const cs = []; for(const [pid, list] of Object.entries(custom)) list.forEach((c,j)=>cs.push({pid, j, ...c}));
  $("custom").innerHTML = cs.length ? `<table><thead><tr><th>answer</th><th>prompt</th><th>tier</th><th></th></tr></thead><tbody>${cs.map((c,i)=>`<tr><td>${esc(c.t)}</td><td class="muted">${esc(BYID[c.pid] ? BYID[c.pid].q : c.pid)}</td><td>${esc(TIERS[c.tier].name)}</td><td><button class="btn line sm" data-rm="${i}">remove</button></td></tr>`).join("")}</tbody></table>` : `<p class="empty">none yet.</p>`;
  $("custom").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ const c = cs[+b.dataset.rm]; custom[c.pid].splice(c.j,1); store(KEY.custom, custom); rebuild(c.pid); renderStaff(); });
}
function addCustom(pid, text, tier){
  text = String(text).trim().slice(0,200); if(!text || !BYID[pid]) return false;
  (custom[pid] || (custom[pid] = [])).push({t:text, tier}); store(KEY.custom, custom); rebuild(pid); return true;
}
addEventListener("keydown", e => { if(e.ctrlKey && e.shiftKey && (e.key==="S"||e.key==="s")){ e.preventDefault(); showStaff(); } });

// ---------- boot ----------
buildGauge(); sizeParts(); layout(); toHome(); frame();
addEventListener("resize", ()=>{ sizeParts(); layout(); });
if(location.hash === "#staff") setTimeout(showStaff, 50);
</script>

</body>
</html>
